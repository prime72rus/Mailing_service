[tool.poetry]
name = "mailing-service"
version = "0.1.0"
description = "Web-app Mailing message service"
authors = ["Dmitrii Grechko <prime72rus@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
python-dotenv = "^1.1.0"
django = "^5.2.2"
psycopg2 = "^2.9.10"
redis = "^6.2.0"
ipython = "^9.3.0"


[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
flake8 = "^7.2.0"
isort = "^6.0.1"
mypy = "^1.16.0"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = '.venv'

[tool.black]
line-length = 79
exclude = '''
(
  /(
      \.git
  )/
)
'''

[tool.isort]
line_length = 79
multi_line_output = 3
